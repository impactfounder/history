<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 14" width="20" height="14" role="img" aria-label="AI">
  <!--
    국기가 아니라 마크다. AI 열은 나라가 아니므로 국기가 없는데, 열 헤더는 20×14 자리를
    비워 두면 다른 네 열과 정렬이 어긋난다. 색은 열 색(#a1490b)과 같은 값을 쓴다 —
    <img>라 CSS 변수를 못 받으므로 globals.css의 --region-ai와 **손으로 맞춘 사본**이다.
  -->
  <rect width="20" height="14" rx="2" fill="#a1490b"/>
  <g fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round">
    <path d="M6.5 4.5 L10 7 L6.5 9.5"/>
    <path d="M10 7 H14"/>
  </g>
  <circle cx="6.5" cy="4.5" r="1.1" fill="#fff"/>
  <circle cx="6.5" cy="9.5" r="1.1" fill="#fff"/>
  <circle cx="14" cy="7" r="1.1" fill="#fff"/>
</svg>
